<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ChainOps simulated incident recovery loop</title>
  <desc id="desc">A simulated RPC failure flows through telemetry, SLO alerting, incident response, Demo AI analysis, policy approval, simulated failover, and recovery verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#111d2b"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#637c93"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="20" fill="url(#bg)"/>
  <text x="48" y="54" fill="#f4f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">THE INCIDENT RECOVERY LOOP</text>
  <text x="48" y="82" fill="#9fb0c1" font-family="Segoe UI,Arial,sans-serif" font-size="14">A connected, policy-gated simulation. No live infrastructure is controlled.</text>
  <g fill="none" stroke="#637c93" stroke-width="2" marker-end="url(#arrow)">
    <path d="M245 190H293"/><path d="M495 190H543"/><path d="M745 190H793"/>
    <path d="M895 235V330"/><path d="M800 375H752"/><path d="M550 375H502"/><path d="M300 375H252"/>
    <path d="M145 330V272Q145 252 165 252H1100Q1120 252 1120 232" stroke="#30485c" stroke-dasharray="6 7" marker-end="none"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g><rect x="45" y="145" width="200" height="90" rx="12" fill="#251d25" stroke="#fa7769"/><text x="145" y="181" fill="#fa9589" font-size="12" font-weight="700">01 · INJECT</text><text x="145" y="207" fill="#f4f7fb" font-size="17" font-weight="600">RPC degradation</text></g>
    <g><rect x="295" y="145" width="200" height="90" rx="12" fill="#182738" stroke="#4fb9c8"/><text x="395" y="181" fill="#70d2dc" font-size="12" font-weight="700">02 · OBSERVE</text><text x="395" y="207" fill="#f4f7fb" font-size="17" font-weight="600">Telemetry shifts</text></g>
    <g><rect x="545" y="145" width="200" height="90" rx="12" fill="#182738" stroke="#4fb9c8"/><text x="645" y="181" fill="#70d2dc" font-size="12" font-weight="700">03 · DETECT</text><text x="645" y="207" fill="#f4f7fb" font-size="17" font-weight="600">SLO alert fires</text></g>
    <g><rect x="795" y="145" width="200" height="90" rx="12" fill="#182738" stroke="#4fb9c8"/><text x="895" y="181" fill="#70d2dc" font-size="12" font-weight="700">04 · RESPOND</text><text x="895" y="207" fill="#f4f7fb" font-size="17" font-weight="600">Incident opened</text></g>
    <g><rect x="800" y="330" width="200" height="90" rx="12" fill="#211e31" stroke="#a994df"/><text x="900" y="366" fill="#c3b2ff" font-size="12" font-weight="700">05 · ANALYZE</text><text x="900" y="392" fill="#f4f7fb" font-size="17" font-weight="600">Evidence-based RCA</text></g>
    <g><rect x="550" y="330" width="200" height="90" rx="12" fill="#211e31" stroke="#a994df"/><text x="650" y="366" fill="#c3b2ff" font-size="12" font-weight="700">06 · GOVERN</text><text x="650" y="392" fill="#f4f7fb" font-size="17" font-weight="600">Policy + approval</text></g>
    <g><rect x="300" y="330" width="200" height="90" rx="12" fill="#1d2b26" stroke="#6ac295"/><text x="400" y="366" fill="#83ddb0" font-size="12" font-weight="700">07 · REMEDIATE</text><text x="400" y="392" fill="#f4f7fb" font-size="17" font-weight="600">Simulated failover</text></g>
    <g><rect x="50" y="330" width="200" height="90" rx="12" fill="#1d2b26" stroke="#6ac295"/><text x="150" y="366" fill="#83ddb0" font-size="12" font-weight="700">08 · VERIFY</text><text x="150" y="392" fill="#f4f7fb" font-size="17" font-weight="600">Recover + resolve</text></g>
  </g>
  <circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" path="M245 190H293 M495 190H543 M745 190H793 M895 235V330 M800 375H752 M550 375H502 M300 375H252 M145 330V272Q145 252 165 252H1100Q1120 252 1120 232"/></circle>
  <text x="48" y="500" fill="#91a5b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Deterministic demo data · approval required · no provider endpoint contacted</text>
  <text x="1152" y="500" fill="#70d2dc" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">CHAINOPS / RUNBOOK 001</text>
</svg>
